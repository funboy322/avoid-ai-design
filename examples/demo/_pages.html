<!doctype html>
<!-- Render scaffold for docs/consistency.png (1600x1040 @2x): one system across pages. Not part of the lesson. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  :root{ --ground:#e8ecf0; --ink:#14202b; --muted:#52606d; --line:#bcc6d1; }
  html,body{ width:1600px; height:1040px; overflow:hidden; }
  body{ background:var(--ground); color:var(--ink); font-family:"Schibsted Grotesk","Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  .top{ display:flex; justify-content:space-between; align-items:baseline; padding:34px 60px 0; }
  .wm{ font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .tag{ font-size:17px; color:var(--muted); }
  .stage{ flex:1; display:flex; justify-content:center; align-items:center; gap:34px; }
  .group{ border:1.5px solid var(--line); border-radius:14px; padding:18px 20px 22px; }
  .gt{ font-size:17px; margin-bottom:14px; }
  .gt b{ font-weight:800; }
  .gt span{ color:var(--muted); }
  .row{ display:flex; gap:20px; }
  .label{ font-size:15px; font-weight:700; margin:0 0 8px 2px; }
  .panel{ width:452px; height:650px; border-radius:10px; overflow:hidden; background:#fff; box-shadow:0 1px 0 rgba(20,32,43,.08), 0 24px 48px -30px rgba(20,32,43,.5); }
  .panel iframe{ width:1280px; height:1841px; border:0; transform:scale(.353); transform-origin:top left; }
  .cap{ text-align:center; font-size:16.5px; color:var(--muted); padding:0 60px 30px; }
  .cap b{ color:var(--ink); }
</style>
</head>
<body>
  <div class="top"><div class="wm">avoid-ai-design</div><div class="tag">One design system, every page</div></div>
  <div class="stage">
    <section class="group"><p class="gt"><b>Same system</b> <span>built from one DESIGN.md</span></p>
      <div class="row">
        <div><p class="label">Home</p><div class="panel"><iframe src="refined.html" scrolling="no"></iframe></div></div>
        <div><p class="label">FAQ</p><div class="panel"><iframe src="faq.html" scrolling="no"></iframe></div></div>
      </div>
    </section>
    <section class="group"><p class="gt"><b>Regenerated from scratch</b> <span>design-system drift</span></p>
      <div><p class="label">FAQ</p><div class="panel"><iframe src="faq-drift.html" scrolling="no"></iframe></div></div>
    </section>
  </div>
  <p class="cap"><b>Home and FAQ share one contract:</b> the same tokens, header, footer, type, and heat ramp. Regenerate the FAQ from scratch and it drifts back to the median.</p>
</body>
</html>
